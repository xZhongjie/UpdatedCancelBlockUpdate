name: Build

on:
  push:
    branches:
      - '1.19.2'
      - '1.20.1'
      - '1.20.4'
      - '1.21.1'
      - '1.21.4'
      - '1.21.8'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Loom 1.17+ 需要 Java 21 运行 Gradle；编译目标版本由 gradle.properties 的 java_version 决定
      # （JDK 21 可通过 options.release 编译出 Java 17 字节码，供 1.19.2/1.20.x 分支使用）。
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CancelBlockUpdate-${{ github.ref_name }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
