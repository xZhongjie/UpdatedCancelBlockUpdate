name: Build

on:
  push:
    branches:
      - '1.19.2'
      - '1.20.1'
      - '1.20.4'
      - '1.21.1'
      - '1.21.4'
      - '1.21.10'
      - '1.21.11'
      - '26.1'
      - '26.2'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Loom 1.17+ ????? JDK ?? Gradle?26.x ???? Java 25?????? Java 21
      # ???? java_version=17 ??? JDK 21 ????? options.release=17 ????
      - name: Read java_version
        id: props
        run: |
          JV=$(grep '^java_version' gradle.properties | cut -d= -f2 | tr -d ' ')
          if [ "$JV" = "25" ]; then echo "jdk=25" >> "$GITHUB_OUTPUT"; else echo "jdk=21" >> "$GITHUB_OUTPUT"; fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.props.outputs.jdk }}
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UpdatedCancelBlockUpdate-${{ github.ref_name }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar